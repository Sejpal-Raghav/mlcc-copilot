version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tecdia_user
      POSTGRES_PASSWORD: tecdia_password
      POSTGRES_DB: tecdia_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
